name: 🐛 Bug report
description: Something isn't working as documented
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! A small reproduction is the fastest way to get it fixed.
        Tip: fork the [live Snack](https://snack.expo.dev/@git/github.com/anuj-kumary/react-native-toastify:example), reproduce the bug there, and paste the link below.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/anuj-kumary/react-native-toastify/issues?q=is%3Aissue) and this hasn't been reported.
          required: true
        - label: I'm using the latest version of react-native-toastify-expo.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug. Include any error message or warning in full.
      placeholder: When I call toast.success() inside a modal, the toast appears behind the modal.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction code
      description: The smallest code that shows the bug. It's formatted as code automatically.
      render: tsx
      placeholder: |
        import { ToastProvider, toast } from 'react-native-toastify-expo';

        export default function App() {
          return (
            <ToastProvider>
              <Button title="Show" onPress={() => toast.success('Hello')} />
            </ToastProvider>
          );
        }
    validations:
      required: true
  - type: input
    id: snack
    attributes:
      label: Snack or repository link
      description: Optional, but it makes the bug much faster to fix.
      placeholder: https://snack.expo.dev/...
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap "Show"
        3. ...
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms affected
      multiple: true
      options:
        - iOS
        - Android
        - Web
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Project setup
      options:
        - Expo Go
        - Expo development build
        - Bare React Native
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: react-native-toastify-expo version
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: rn-version
    attributes:
      label: React Native and Expo SDK versions
      placeholder: react-native 0.81, Expo SDK 54
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or screen recording
      description: Drag files in here. Helpful for layout and animation bugs.
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Device model, OS version, other libraries involved (navigation, modals, keyboard)…
